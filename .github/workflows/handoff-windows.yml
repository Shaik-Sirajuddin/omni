name: handoff-windows

# Manual-only functional verification of the Windows ConPTY relay endpoint
# (svc/ptydaemon/handoff) on a GitHub-hosted Windows runner. WIP branch — trigger
# by hand (gh workflow run / Actions UI), never on push.
#
# Sparse checkout skips omni/ because the repo contains a path with a trailing
# space ('omni/operator/design.md ') that is illegal on NTFS and makes a full
# Windows checkout fail with git exit 128. The handoff package only needs
# svc/ptydaemon (+ pkg) and golang.org/x/sys, so GOWORK=off isolates it.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows-handoff:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: svc/ptydaemon
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            svc/ptydaemon
            pkg
          sparse-checkout-cone-mode: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: go version
        run: go version
      - name: build (windows)
        run: go build ./handoff/
      - name: vet (windows)
        run: go vet ./handoff/
      - name: test (windows, verbose)
        run: go test -count=1 -v ./handoff/
