name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      level:
        description: "Semver bump level applied to the latest tag"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      force:
        description: "Create a new tag even if the latest tag already points to the current commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On manual dispatch: bump the latest semver tag by the selected level,
      # create the new tag on the current commit, and push it. Pushing with the
      # default GITHUB_TOKEN does not re-trigger the `push: tags` event, so this
      # produces exactly one release run.
      - name: Compute and push new tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ -n "$latest" ] || latest="v0.0.0"
          echo "latest tag: $latest"

          ver=${latest#v}
          major=$(echo "$ver" | cut -d. -f1)
          minor=$(echo "$ver" | cut -d. -f2)
          patch=$(echo "$ver" | cut -d. -f3)

          case "${{ inputs.level }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown level '${{ inputs.level }}'"; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "next tag: $next"

          head=$(git rev-parse HEAD)
          latest_commit=$(git rev-list -n1 "$latest" 2>/dev/null || echo "")
          if [ "$head" = "$latest_commit" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::error::HEAD ($head) is already tagged $latest and force=false. Re-run with force=true to release the same commit as $next."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::tag $next already exists"
            exit 1
          fi

          git tag -a "$next" -m "$next"
          git push origin "$next"
          echo "::notice::created and pushed tag $next"

      - uses: actions/setup-go@v5
        with:
          go-version-file: omni/go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
